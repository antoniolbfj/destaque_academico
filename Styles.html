<style>
  :root {
    --iftm-green: #146b3a;
    --iftm-green-dark: #0e4e2b;
    --iftm-green-soft: #e9f5ee;
    --surface: #ffffff;
    --surface-alt: #f6f8f7;
    --border: #dfe6e2;
    --text: #1d2521;
    --muted: #65716a;
    --warning: #8a5b00;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f7f5; color: var(--text); min-height: 100vh; font-family: Arial, Helvetica, sans-serif; }
  .app-shell { max-width: 1480px; }

  .app-header {
    background: linear-gradient(135deg, var(--iftm-green-dark), var(--iftm-green));
    color: #fff;
    padding: 18px 0;
    box-shadow: 0 2px 14px rgba(0,0,0,.12);
  }
  .institution-logo { width: 205px; max-height: 70px; object-fit: contain; background: #fff; border-radius: 7px; padding: 8px 10px; }
  .institution-name { font-size: .92rem; opacity: .88; font-weight: 700; }
  .app-title { font-size: clamp(1.45rem, 2.5vw, 2.15rem); font-weight: 800; letter-spacing: -.02em; }
  .dev-badge { display: inline-flex; align-items: center; border-radius: 999px; background: #fff3cd; color: #664d03; padding: 5px 9px; font-size: .68rem; font-weight: 900; letter-spacing: .06em; }
  .dev-subtitle { margin-top: 4px; font-size: .78rem; opacity: .88; }

  .app-menu-bar { position: sticky; top: 0; z-index: 1020; background: #fff; border-bottom: 1px solid var(--border); box-shadow: 0 2px 10px rgba(25,61,42,.05); }
  .app-menu-item { border: 0; background: transparent; color: #284537; padding: 12px 15px; font-weight: 750; }
  .app-menu-item:hover, .app-menu-item:focus { background: var(--iftm-green-soft); color: var(--iftm-green-dark); }
  .auth-user-button { display: inline-flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 7px 4px 7px 10px; color: #284537; }
  .auth-user-avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--iftm-green-soft); color: var(--iftm-green); }
  .auth-user-copy { display: grid; text-align: left; line-height: 1.12; }
  .auth-user-copy strong { font-size: .84rem; }
  .auth-user-copy small { color: var(--muted); font-size: .72rem; }
  .auth-user-chevron { color: #718078; }

  .login-screen { min-height: calc(100vh - 150px); }
  .login-layout { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(340px, .75fr); gap: clamp(28px,6vw,72px); align-items: center; min-height: 62vh; }
  .login-intro h2 { max-width: 730px; margin: 10px 0 14px; font-size: clamp(2rem,4vw,3.6rem); line-height: 1.02; letter-spacing: -.035em; color: #183c29; }
  .login-intro > p { max-width: 720px; color: var(--muted); font-size: 1.04rem; line-height: 1.65; }
  .login-kicker, .workspace-kicker, .side-panel-kicker, .startup-kicker { color: var(--iftm-green); font-size: .76rem; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; }
  .login-feature-list { display: grid; gap: 12px; margin-top: 25px; max-width: 690px; }
  .login-feature-list > div { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
  .login-feature-list i { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; background: var(--iftm-green-soft); color: var(--iftm-green); }
  .login-feature-list span { display: grid; }
  .login-feature-list small { color: var(--muted); margin-top: 2px; }
  .login-card { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: clamp(25px,4vw,38px); box-shadow: 0 18px 48px rgba(19,70,44,.10); }
  .login-card-icon { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--iftm-green-soft); color: var(--iftm-green); font-size: 1.3rem; margin-bottom: 16px; }
  .login-code-input { font-size: 1.6rem; letter-spacing: .3em; font-weight: 800; }
  .login-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .normal-label { text-transform: none !important; letter-spacing: 0 !important; }

  .startup-screen { min-height: calc(100vh - 150px); display: flex; justify-content: center; padding: clamp(34px,6vh,72px) 0 48px; }
  .startup-shell { display: flex; justify-content: center; }
  .startup-card { width: min(760px,100%); background: #fff; border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 18px 48px rgba(19,70,44,.10); padding: clamp(24px,4vw,38px); }
  .startup-heading { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; padding-bottom: 22px; border-bottom: 1px solid #e7ece9; }
  .startup-heading h2 { margin: 4px 0 6px; font-weight: 800; color: #173426; }
  .startup-heading p { margin: 0; color: var(--muted); }
  .startup-spinner { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--iftm-green-soft); }
  .startup-spinner span { width: 22px; height: 22px; border: 3px solid rgba(20,107,58,.22); border-top-color: var(--iftm-green); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .startup-stages { list-style: none; padding: 20px 0 8px; margin: 0; display: grid; gap: 2px; }
  .startup-stages li { display: grid; grid-template-columns: 30px 1fr; gap: 11px; align-items: start; padding: 9px 10px; border-radius: 10px; color: #7b8780; }
  .startup-stages li.is-active { background: #f2f8f4; color: #244a36; }
  .startup-stages li.is-complete { color: #355d47; }
  .startup-stages li.is-error { background: #fff4f3; color: #8d2e28; }
  .startup-stage-icon { width: 26px; height: 26px; display: grid; place-items: center; }
  .startup-stages li.is-active .startup-stage-icon { color: var(--iftm-green); }
  .startup-stages li.is-active .startup-stage-icon i { animation: spin 1s linear infinite; }
  .startup-stages li.is-complete .startup-stage-icon { color: #198754; }
  .startup-stages strong { display: block; font-size: .92rem; }
  .startup-stages small { display: block; color: #79837e; font-size: .78rem; margin-top: 2px; }
  .startup-progress-wrap { margin-top: 12px; padding: 16px 17px; border-radius: 12px; background: #f7f9f8; border: 1px solid #e2e8e4; }
  .startup-progress-meta, .startup-foot { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .startup-progress-meta { margin-bottom: 9px; font-size: .88rem; }
  .startup-progress { height: 8px; }
  .startup-progress .progress-bar { background: linear-gradient(90deg,var(--iftm-green-dark),var(--iftm-green)); transition: width .25s ease; }
  .startup-foot { margin-top: 10px; color: #707b75; font-size: .76rem; }
  .startup-retry { margin-top: 18px; }

  .workspace-title, .workspace-empty { background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 4px 18px rgba(28,56,41,.05); }
  .workspace-title { padding: 22px 24px; }
  .workspace-title h2 { margin: 4px 0 5px; font-weight: 800; color: #183c29; }
  .workspace-title p { margin: 0; color: var(--muted); }
  .workspace-empty { min-height: 390px; display: grid; place-items: center; padding: 35px; }
  .workspace-empty-inner { max-width: 560px; display: grid; justify-items: center; text-align: center; gap: 9px; color: var(--muted); }
  .workspace-empty-inner i { font-size: 2.1rem; color: #9b7a2e; }
  .workspace-empty-inner strong { color: #405149; font-size: 1.05rem; }

  .app-side-panel { width: min(680px, 96vw) !important; }
  .side-panel-header { border-bottom: 1px solid var(--border); padding: 18px 20px; }
  .side-panel-layout { display: grid; grid-template-rows: auto auto 1fr; height: calc(100vh - 73px); }
  .side-panel-status { padding: 14px 18px; border-bottom: 1px solid var(--border); background: #fbfcfb; }
  .status-summary { display: flex; align-items: center; gap: 10px; }
  .status-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #edf4f0; color: var(--iftm-green); }
  .side-status-copy { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .status-percent { min-width: 36px; font-size: .78rem; }
  .side-status-copy span { font-size: .84rem; color: #4e5c55; }
  .status-progress { height: 5px; margin-top: 9px; }
  .side-panel-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--border); background: #fff; }
  .side-panel-content { overflow: auto; padding: 18px; }

  .user-admin-section { display: grid; gap: 12px; }
  .parameter-list-intro { color: var(--muted); font-size: .86rem; }
  .user-admin-list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .user-admin-row { display: grid; grid-template-columns: 1.1fr .72fr 1.35fr; gap: 12px; align-items: center; width: 100%; padding: 11px 12px; border: 0; border-bottom: 1px solid var(--border); text-align: left; background: #fff; }
  .user-admin-row:last-child { border-bottom: 0; }
  .user-admin-head { background: #f6f8f7; color: #66736c; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .user-admin-item:hover { background: #f1f8f4; }
  .user-admin-name { font-weight: 700; }
  .user-admin-email { color: #596861; font-size: .84rem; overflow-wrap: anywhere; }


  .data-import-section { display: grid; gap: 13px; }
  .data-import-intro { display: grid; gap: 4px; padding: 13px 14px; border-radius: 10px; background: #f2f8f4; border: 1px solid #d9e9df; }
  .data-import-intro strong { color: #244a36; }
  .data-import-intro span { color: var(--muted); font-size: .84rem; line-height: 1.45; }
  .data-step-card { display: grid; gap: 12px; padding: 14px; background: #fff; border: 1px solid var(--border); border-radius: 11px; }
  .data-step-title { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 10px; align-items: start; }
  .data-step-title > span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--iftm-green-soft); color: var(--iftm-green-dark); font-weight: 900; font-size: .78rem; }
  .data-step-title > div { min-width: 0; display: grid; }
  .data-step-title strong { color: #294a39; }
  .data-step-title small { color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .data-period-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
  .data-file-card { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 11px; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; }
  .data-file-card > div { min-width: 0; display: grid; }
  .data-file-card strong { overflow-wrap: anywhere; }
  .data-file-card small { color: var(--muted); font-size: .75rem; margin-top: 2px; }
  .data-validation-summary { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin-bottom: 10px; }
  .data-validation-summary > div { display: grid; gap: 2px; padding: 10px; border-radius: 9px; background: #f7f9f8; border: 1px solid #e4e9e6; }
  .data-validation-summary span { color: var(--muted); font-size: .71rem; text-transform: uppercase; font-weight: 800; letter-spacing: .035em; }
  .data-validation-summary strong { color: #244a36; font-size: 1.05rem; }
  .data-warning-list { display: grid; gap: 7px; margin-top: 10px; }
  .data-warning-item { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; align-items: start; padding: 10px 11px; border-radius: 8px; font-size: .82rem; line-height: 1.4; }
  .data-warning-warning { background: #fff7e5; color: #755116; border: 1px solid #f0dfb8; }
  .data-warning-info { background: #eef5fa; color: #315b74; border: 1px solid #d8e7f0; }
  .data-validation-note { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 9px; align-items: start; margin-top: 12px; padding: 11px 12px; border-radius: 9px; background: #fff4f3; border: 1px solid #f0d4d0; color: #7b3832; font-size: .8rem; line-height: 1.45; }
  .data-inline-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-start; padding-top: 2px; }
  .data-flow-footer { display: flex; justify-content: flex-end; padding: 2px 2px 8px; }
  .data-flow-footer .btn-link { color: var(--muted); text-decoration: none; }
  .data-flow-footer .btn-link:hover { color: var(--iftm-green-dark); }
  .data-period-grid-single { grid-template-columns: minmax(0, 240px); }
  .data-soft-badge { display: inline-flex; align-items: center; white-space: nowrap; border-radius: 999px; padding: 4px 8px; font-size: .7rem; font-weight: 800; }
  .data-badge-ok { background: #edf7f1; color: #2f6847; border: 1px solid #d6eadf; }
  .data-badge-warning { background: #fff7e5; color: #755116; border: 1px solid #f0dfb8; }
  .data-state-card { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; align-items: start; padding: 10px 11px; border-radius: 8px; font-size: .82rem; line-height: 1.4; }
  .data-state-ok { background: #f0f8f3; color: #2f6847; border: 1px solid #d8eadf; }
  .data-state-neutral { background: #f7f9f8; color: #596861; border: 1px solid #e2e8e4; }
  .data-choice-list { display: grid; gap: 8px; }
  .data-choice-card { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: center; padding: 11px 12px; border: 1px solid var(--border); border-radius: 9px; background: #fff; cursor: pointer; }
  .data-choice-card:hover { background: #f6faf7; border-color: #cbdcd2; }
  .data-choice-card:has(input:checked) { background: #eef7f1; border-color: #bcd7c7; }
  .data-choice-card span { display: grid; min-width: 0; }
  .data-choice-card strong { color: #294a39; }
  .data-choice-card small { color: var(--muted); font-size: .76rem; margin-top: 2px; }
  .data-inline-confirm { display: grid; gap: 10px; padding: 12px; border-radius: 9px; background: #f7f9f8; border: 1px solid #dfe6e2; }
  .data-inline-confirm-copy { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 9px; align-items: start; color: #3f5448; }
  .data-inline-confirm-copy > div { display: grid; gap: 2px; }
  .data-inline-confirm-copy span { color: var(--muted); font-size: .8rem; line-height: 1.4; }
  .data-inline-confirm-danger { color: #7b3832; }
  .data-validation-summary-result { grid-template-columns: repeat(auto-fit,minmax(110px,1fr)); margin-top: 10px; }
  .data-context-card { display: grid; gap: 10px; padding: 12px; margin: 10px 0; border: 1px solid #d8e8de; border-radius: 10px; background: #f4f9f6; }
  .data-context-card.data-context-mismatch { background: #fff9ed; border-color: #ead9aa; }
  .data-context-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .data-context-head span { color: var(--muted); font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .data-context-head strong { color: #244a36; font-size: .82rem; text-align: right; }
  .data-context-card.data-context-mismatch .data-context-head strong { color: #765519; }
  .data-context-card p { margin: 0; color: #4c5e54; font-size: .82rem; line-height: 1.45; }
  .data-context-operation { display: flex; flex-wrap: wrap; gap: 6px 14px; color: #5d6d64; font-size: .78rem; }
  .data-context-operation strong { color: #294a39; }
  .data-context-metrics { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 7px; }
  .data-context-metrics > div { display: grid; gap: 2px; padding: 8px; border-radius: 8px; background: rgba(255,255,255,.72); border: 1px solid rgba(211,224,216,.85); }
  .data-context-metrics span { color: var(--muted); font-size: .66rem; line-height: 1.2; text-transform: uppercase; font-weight: 800; }
  .data-context-metrics strong { color: #244a36; font-size: .94rem; }
  .data-context-impact { display: flex; flex-wrap: wrap; gap: 7px; }
  .data-context-impact span { padding: 5px 8px; border-radius: 999px; background: #fff; border: 1px solid #dce7e0; color: #596861; font-size: .72rem; }

  .category-admin-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 11px 12px; border: 0; border-bottom: 1px solid var(--border); text-align: left; background: #fff; }
  .category-admin-row:last-child { border-bottom: 0; }
  .category-admin-head { background: #f6f8f7; color: #66736c; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .category-admin-item:hover { background: #f1f8f4; }
  .parameter-empty { color: var(--muted); }
  .parameter-set-card { background: #f7f9f8; border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; }
  .parameter-set-code { font-size: .7rem; color: var(--muted); font-weight: 800; letter-spacing: .05em; }
  .parameter-set-name { font-weight: 800; color: #274735; margin: 2px 0 6px; }

  @media (max-width: 850px) {
    .login-layout { grid-template-columns: 1fr; min-height: auto; }
    .login-intro h2 { font-size: 2.2rem; }
    .user-admin-row { grid-template-columns: 1fr; gap: 4px; }
    .user-admin-head { display: none; }
    .category-admin-row { grid-template-columns: 1fr auto; }
    .data-context-metrics { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .data-period-grid, .data-validation-summary { grid-template-columns: 1fr; }
  }

  /* ===== Mesa de Apuração 1.9 ===== */
  body.authenticated-mode { overflow: hidden; background: #f5f7f6; }
  body.authenticated-mode #publicHeader { display: none !important; }
  .auth-shell { min-height: 100vh; display: grid; grid-template-columns: 236px minmax(0,1fr); background: #f5f7f6; transition: grid-template-columns .18s ease; }
  .auth-shell.sidebar-collapsed { grid-template-columns: 0 minmax(0,1fr); }
  .app-sidebar { min-width: 0; overflow: hidden; color: #fff; background: linear-gradient(180deg,#0b3d2e,#082f25); }
  .app-sidebar-inner { width: 236px; height: 100vh; padding: 17px 14px; position: sticky; top: 0; overflow-y: auto; }
  .sidebar-brand { display: flex; gap: 10px; align-items: center; padding: 2px 6px 18px; }
  .sidebar-brand img { width: 42px; height: 42px; object-fit: contain; padding: 5px; border-radius: 10px; background: #fff; }
  .sidebar-brand strong { display: block; font-size: .88rem; line-height: 1.15; }
  .sidebar-brand small { display: block; margin-top: 3px; color: #b8d1c6; font-size: .62rem; }
  .sidebar-section { padding: 13px 10px 5px; color: #85a99a; font-size: .59rem; font-weight: 800; text-transform: uppercase; letter-spacing: .11em; }
  .sidebar-item { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 10px; margin: 2px 0; border: 0; border-radius: 9px; background: transparent; color: #d9e8e1; font-size: .78rem; text-align: left; }
  .sidebar-item i { width: 21px; text-align: center; font-size: .9rem; }
  .sidebar-item:hover { background: rgba(255,255,255,.07); }
  .sidebar-item.is-active { background: #fff; color: #0b3d2e; font-weight: 800; }
  .auth-main { min-width: 0; height: 100vh; overflow: hidden; display: grid; grid-template-rows: 56px minmax(0,1fr); }
  .auth-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; padding: 0 20px; border-bottom: 1px solid #dfe7e3; background: #fff; z-index: 40; }
  .auth-hamburger { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid #dfe7e3; border-radius: 8px; background: #fff; color: #0b3d2e; font-size: 1.15rem; }
  .auth-breadcrumb { color: #68766f; font-size: .72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .auth-breadcrumb strong { color: #17201c; }
  .apuration-workspace { min-height: 0; overflow: hidden; display: grid; grid-template-columns: minmax(0,1fr); grid-template-rows: auto minmax(0,1fr); background: #f5f7f6; }
  .apuration-sticky { position: relative; z-index: 30; padding: 9px 20px 8px; border-bottom: 1px solid #dfe7e3; background: rgba(255,255,255,.98); box-shadow: 0 3px 10px rgba(8,47,37,.045); }
  .apuration-context-row { display: grid; grid-template-columns: 90px minmax(240px,370px) 135px minmax(175px,260px) auto; align-items: end; gap: 8px; }
  .ap-field { min-width: 0; }
  .ap-field label { display: block; margin: 0 0 3px 2px; color: #68766f; font-size: .56rem; font-weight: 800; text-transform: uppercase; letter-spacing: .045em; }
  .ap-control { width: 100%; height: 31px; padding: 0 8px; border: 1px solid #dfe7e3; border-radius: 7px; outline: none; background: #fff; color: #17201c; font-size: .68rem; }
  .ap-control:focus { border-color: #81b69c; box-shadow: 0 0 0 2px rgba(29,122,78,.07); }
  .ap-kpis { display: flex; align-items: center; justify-content: flex-end; gap: 5px; min-width: 0; overflow: hidden; }
  .ap-kpis > span { height: 31px; display: flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid #dfe7e3; border-radius: 7px; background: #fafcfb; white-space: nowrap; }
  .ap-kpis strong { color: #173d2d; font-size: .75rem; }
  .ap-kpis small { color: #738078; font-size: .52rem; font-weight: 700; text-transform: uppercase; }
  .ap-state-row { min-height: 33px; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 6px; }
  .ap-state-zone { min-width: 0; display: flex; align-items: center; gap: 12px; }
  .ap-state-stepper { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
